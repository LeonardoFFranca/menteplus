name: Gerar APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MentePlus-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar APK (release + branch apk)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk MentePlus.apk
          gh release delete latest -y --cleanup-tag || true
          gh release create latest MentePlus.apk -t "Mente+ APK" -n "APK gerado automaticamente"
          git config user.name github-actions; git config user.email actions@github.com
          git checkout --orphan apk-out; git rm -rfq --cached .; git add MentePlus.apk
          git commit -qm "APK"; git push -f origin apk-out
