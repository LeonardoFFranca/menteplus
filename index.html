<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10132a"><title>Mente+ | Aprenda e evolua</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#f6f7ff;background:#0c1021}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% -10%,#27346a 0,transparent 43%),#0c1021;min-height:100vh}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #82e7c8}main{max-width:580px;margin:auto;padding:24px 20px 108px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.brand{font-weight:900;font-size:25px;letter-spacing:-1px}.brand span{color:#74e8c5}.avatar{background:#283354;border:1px solid #465477;border-radius:17px;padding:10px 13px}.eyebrow{font-size:12px;color:#9faed0;letter-spacing:1.4px;font-weight:750;text-transform:uppercase}h1{font-size:31px;line-height:1.12;letter-spacing:-1.1px;margin:10px 0}h2{font-size:21px;letter-spacing:-.5px}p{color:#b4bed7;line-height:1.6}.hero{background:linear-gradient(130deg,#344a99,#6745a6);padding:24px;border-radius:26px;position:relative;overflow:hidden;box-shadow:0 18px 45px #0003}.hero:after{content:'✦';position:absolute;right:20px;top:6px;font-size:110px;opacity:.15}.hero p{color:#e4e7ff}.pill{display:inline-flex;gap:5px;align-items:center;background:#ffffff23;border:1px solid #ffffff25;border-radius:30px;padding:7px 12px;font-size:12px;font-weight:700}.primary{border:0;background:#80ebc8;color:#102539;border-radius:15px;padding:14px 20px;font-weight:850}.secondary{background:#252e4b;color:white;border:1px solid #425071;border-radius:14px;padding:12px 15px}.wide{width:100%}.section{display:flex;justify-content:space-between;align-items:center;margin-top:29px}.muted{font-size:13px;color:#9faed0}.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{border:1px solid #34405d;border-radius:22px;padding:18px;background:#171e36;text-align:left;color:#fff;min-height:150px;display:flex;flex-direction:column;justify-content:space-between}.card .emoji{font-size:29px}.card strong{display:block;font-size:17px;margin:8px 0 3px}.card small{color:#a7b6d4}.card.purple{background:linear-gradient(140deg,#302457,#1a213c)}.card.green{background:linear-gradient(140deg,#164b50,#1a213c)}.card.orange{background:linear-gradient(140deg,#5c382d,#1a213c)}.card.blue{background:linear-gradient(140deg,#233f6a,#1a213c)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.stat{background:#171e36;border:1px solid #303a55;border-radius:18px;padding:15px;text-align:center}.stat b{font-size:23px}.stat small{display:block;color:#9baacb;margin-top:5px}.list{display:grid;gap:10px}.lesson{width:100%;display:flex;align-items:center;gap:14px;background:#171e36;border:1px solid #34405d;border-radius:18px;color:white;text-align:left;padding:15px}.num{width:43px;height:43px;display:grid;place-items:center;border-radius:14px;background:#34446a;color:#aaf4da;font-weight:900;flex-shrink:0}.lesson strong{display:block}.lesson small{color:#9daecf;display:block;margin-top:5px}.chev{margin-left:auto;color:#8d9cba}.back{background:none;border:0;color:#a7b8d8;padding:10px 0;margin-bottom:10px}.panel{background:#171e36;border:1px solid #34405d;border-radius:22px;padding:20px;margin:15px 0}.story{font-size:17px;line-height:1.85;color:#edf0ff}.option{width:100%;padding:15px;text-align:left;border:1px solid #425071;border-radius:15px;background:#202a46;color:#f3f5ff;margin:5px 0}.option.selected{border-color:#83ebc8;background:#204c50}.option.wrong{border-color:#ff8d9b;background:#4b293e}.option:disabled{opacity:.8}.feedback{padding:14px;border-radius:14px;background:#263653;margin:13px 0;color:#c9e7e7}.progress{height:7px;background:#34405b;border-radius:9px;overflow:hidden}.progress>div{height:100%;background:#80ebc8;transition:width .2s}.tag{display:inline-block;background:#293755;color:#a7e9d5;border-radius:8px;padding:5px 8px;font-size:12px;margin:3px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#11182df2;backdrop-filter:blur(18px);border-top:1px solid #2b3550;display:flex;justify-content:space-around;padding:12px 4px max(15px,env(safe-area-inset-bottom));z-index:5}.nav{border:0;background:none;color:#9faac5;display:grid;gap:5px;justify-items:center;font-size:11px}.nav.active{color:#86e8c8}.nav i{font-size:23px;font-style:normal}.center{text-align:center}.memory-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.tile{aspect-ratio:1;border:1px solid #4c5879;border-radius:15px;background:#293451;color:white;font-size:27px}.tile.open{background:#396e70}.tile.matched{background:#215347;border-color:#70e9c4}.big-num{font-size:40px;font-weight:900;color:#83ebc8}.empty{color:#a7b3cc;padding:25px;text-align:center}input[type=text]{width:100%;padding:15px;background:#202a46;color:white;border:1px solid #4b5875;border-radius:13px;font:inherit} @media(min-width:650px){main{padding-top:40px}}
</style></head><body><main id="app"></main><nav class="bottom" id="nav"></nav><script>
const lessons=[
{title:'Rotina e hábitos',level:'A1+',story:'My name is Olivia. I usually wake up at seven. I work at a bookstore near my house. On Fridays, I finish work early and visit my sister.',vocab:[['usually','geralmente'],['near','perto de'],['early','cedo']],q:[['Where does Olivia work?',['At a bookstore','At a hospital','At a school'],0,'Bookstore significa livraria.'],['When does she visit her sister?',['On Mondays','On Fridays','On Sundays'],1,'On Fridays = às sextas-feiras.'],['What does “near my house” mean?',['Longe da minha casa','Dentro da minha casa','Perto da minha casa'],2,'Near = perto de.']]},
{title:'Passado e futuro',level:'A1+ / A2',story:'Last Saturday, Emma wanted to buy a laptop, but the computers were too expensive. She found a tutorial and repaired her old computer. Next weekend, she is going to visit her grandparents.',vocab:[['wanted','queria'],['found','encontrou'],['next weekend','próximo fim de semana']],q:[['Why did Emma not buy a laptop?',['It was too expensive','The store was closed','She lost her money'],0,'Too expensive = caro demais.'],['What did she do instead?',['Bought a phone','Repaired her computer','Called her grandparents'],1,'Repaired = consertou.'],['What will she do next weekend?',['Go shopping','Work late','Visit her grandparents'],2,'Is going to indica um plano futuro.']]},
{title:'Mensagens e e-mails',level:'A2',story:'Hi Alex, I received your message. The meeting has moved from Tuesday to Thursday at 10 a.m. Please send me the report before Wednesday evening. Thanks, Sarah.',vocab:[['received','recebi'],['moved','foi transferida'],['before','antes de']],q:[['When is the meeting now?',['Tuesday at 10','Thursday at 10','Wednesday evening'],1,'Moved from Tuesday to Thursday.'],['What must Alex send?',['A report','A photo','An invitation'],0,'Report = relatório.'],['What is the deadline?',['Thursday morning','Tuesday morning','Wednesday evening'],2,'Before Wednesday evening.']]},
{title:'Compras e preços',level:'A2',story:'This jacket costs $45, but there is a 20% discount today. Mia likes the blue one, although the black jacket is cheaper. She decides to wait until next week.',vocab:[['discount','desconto'],['although','embora'],['cheaper','mais barato']],q:[['What is on sale?',['A jacket','A backpack','A pair of shoes'],0,'Jacket = jaqueta.'],['Which jacket is cheaper?',['Blue','Black','Both cost the same'],1,'The black jacket is cheaper.'],['Does Mia buy it today?',['Yes','She buys two','No, she waits'],2,'She decides to wait.']]},
{title:'Viagem e direções',level:'A2',story:'The train leaves at 8:30, so Daniel arrives at the station twenty minutes early. His ticket says platform four, but the announcement changes it to platform six.',vocab:[['leaves','parte'],['platform','plataforma'],['announcement','aviso']],q:[['When does the train leave?',['8:10','8:30','8:50'],1,'Leaves at 8:30.'],['What platform is announced?',['Four','Five','Six'],2,'It changes to platform six.'],['Why does Daniel arrive early?',['To be at the station before departure','To buy food','To meet a friend'],0,'He arrives twenty minutes early.']]},
{title:'Tecnologia e problemas',level:'A2',story:'Lena could not open an important file because her computer was running out of storage. After deleting some old videos, she restarted the computer and opened the file successfully.',vocab:[['storage','armazenamento'],['deleting','apagando'],['successfully','com sucesso']],q:[['What was the problem?',['No internet','Low storage','Broken keyboard'],1,'Running out of storage = ficando sem espaço.'],['What did she delete?',['Old videos','Documents','Photos'],0,'Some old videos.'],['Did she open the file?',['No','Not mentioned','Yes'],2,'Successfully indica que conseguiu.']]},
{title:'Escolhas e consequências',level:'A2+',story:'Although Rafael had enough money to buy a new bicycle, he chose to repair his old one. He saved the remaining money for a trip, which he had been planning for months.',vocab:[['although','embora'],['remaining','restante'],['had been planning','vinha planejando']],q:[['Why did Rafael not buy a new bicycle?',['He chose to repair his old one','He had no money','The shop was closed'],0,'He chose to repair his old one.'],['What did he save money for?',['A computer','A trip','A car'],1,'For a trip.'],['How long had he planned the trip?',['A few days','A week','Months'],2,'For months.']]},
{title:'Notícias e fatos',level:'A2+',story:'A local library has extended its opening hours after a survey showed that many residents preferred visiting in the evening. The new schedule will be tested for three months.',vocab:[['extended','ampliou'],['survey','pesquisa'],['residents','moradores']],q:[['What changed?',['Book prices','Opening hours','The library address'],1,'Extended its opening hours.'],['Why was it changed?',['Residents preferred evenings','The library moved','Books were missing'],0,'Many residents preferred visiting in the evening.'],['How long is the test?',['One month','Six months','Three months'],2,'For three months.']]},
{title:'Comparações',level:'A2+',story:'The smaller apartment is closer to the city center, but it is noisier and more expensive. The larger apartment is farther away, although it has a beautiful garden.',vocab:[['closer','mais perto'],['noisier','mais barulhento'],['farther','mais distante']],q:[['Which apartment costs more?',['The smaller one','The larger one','They cost the same'],0,'The smaller apartment is more expensive.'],['Which one has a garden?',['Smaller','Larger','Both'],1,'The larger apartment has a garden.'],['Which is closer to the center?',['Larger','Neither','Smaller'],2,'The smaller apartment is closer.']]},
{title:'Planos e condições',level:'B1 inicial',story:'If the weather improves tomorrow, Nina will go hiking with her friends. Otherwise, they will stay indoors and watch a documentary. They have already prepared everything they need.',vocab:[['if','se'],['otherwise','caso contrário'],['already','já']],q:[['What will they do if the weather improves?',['Go hiking','Watch a movie','Visit a museum'],0,'If the weather improves, they will go hiking.'],['What happens if it does not improve?',['They cancel all plans','They stay indoors','They go swimming'],1,'Otherwise, they will stay indoors.'],['Are they prepared?',['No','Not mentioned','Yes'],2,'They have already prepared everything.']]},
{title:'Entendendo opiniões',level:'B1 inicial',story:'In my opinion, working from home saves time because people do not need to commute. However, some workers find it harder to concentrate when they are surrounded by distractions.',vocab:[['commute','deslocar-se ao trabalho'],['however','porém'],['surrounded','cercados']],q:[['What is one benefit of working from home?',['Saving time','Getting a promotion','Working fewer days'],0,'People do not need to commute.'],['What is one disadvantage?',['More travel','Difficulty concentrating','Higher rent'],1,'Harder to concentrate.'],['Does the text present only advantages?',['Yes','It does not mention work','No'],2,'However introduces a contrasting idea.']]},
{title:'Interpretação avançada',level:'B1 inicial',story:'Despite several unexpected delays, the team completed the project before the deadline. Their manager praised their flexibility but suggested improving communication to avoid similar problems in the future.',vocab:[['despite','apesar de'],['praised','elogiou'],['deadline','prazo final']],q:[['Was the project completed on time?',['Yes','No','It was canceled'],0,'Before the deadline = antes do prazo.'],['What did the manager praise?',['Their budget','Their flexibility','Their equipment'],1,'Praised their flexibility.'],['What needs improvement?',['The building','The deadline','Communication'],2,'Suggested improving communication.']]}];
const puzzles=[{q:'Qual número continua a sequência? 2, 4, 8, 16, ...',opts:['24','32','30'],a:1,why:'Cada número é o dobro do anterior.'},{q:'Se todos os gatos são animais, qual afirmação é necessariamente verdadeira?',opts:['Todos os animais são gatos','Alguns animais não existem','Todos os gatos são animais'],a:2,why:'É exatamente a relação dada.'},{q:'Qual número falta? 3, 6, 11, 18, 27, ...',opts:['38','36','40'],a:0,why:'As diferenças são 3, 5, 7, 9 e 11.'},{q:'Uma camiseta custa R$ 80 e tem 25% de desconto. Qual o preço final?',opts:['R$ 65','R$ 60','R$ 55'],a:1,why:'25% de 80 = 20; 80 − 20 = 60.'},{q:'Ana é mais alta que Bia. Bia é mais alta que Carla. Quem é a mais baixa?',opts:['Ana','Bia','Carla'],a:2,why:'Carla está abaixo das outras duas na comparação.'},{q:'Qual palavra não pertence ao grupo?',opts:['Triângulo','Quadrado','Círculo'],a:2,why:'O círculo não possui lados retos.'}];
let state={page:'home',lesson:0,q:0,selected:null,show:false,game:'',step:0,seq:[],shown:false,grid:[],open:[],matched:[],moves:0};let saved=JSON.parse(localStorage.getItem('menteplus-data')||'{}');let data={completed:saved.completed||[],xp:saved.xp||0,best:saved.best||0};const $=s=>document.querySelector(s);const save=()=>localStorage.setItem('menteplus-data',JSON.stringify(data));function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function goto(p){state.page=p;state.selected=null;state.show=false;render();window.scrollTo(0,0)}function nav(){let items=[['home','⌂','Início'],['english','▤','Inglês'],['brain','◈','Mente'],['progress','◉','Progresso']];$('#nav').innerHTML=items.map(([id,ic,t])=>`<button class="nav ${state.page===id?'active':''}" onclick="goto('${id}')"><i>${ic}</i>${t}</button>`).join('')};function head(t){return `<button class="back" onclick="goto('home')">← Voltar</button><div class="eyebrow">Mente+ · ${t}</div>`}function render(){nav();let html='';if(state.page==='home'){html=`<div class="top"><div class="brand">mente<span>+</span></div><div class="avatar">✦ ${data.xp} XP</div></div><div class="eyebrow">Seu espaço de aprendizagem</div><h1>Um pouco melhor<br>todos os dias.</h1><p>Aprenda inglês lendo e desafie seu raciocínio no seu ritmo.</p><div class="hero"><span class="pill">✦ Sua jornada continua</span><h2>Inglês sem precisar falar</h2><p>12 aulas com histórias, vocabulário e perguntas de tocar.</p><button class="primary" onclick="goto('english')">Continuar aprendendo →</button></div><div class="section"><h2>Explore suas habilidades</h2></div><div class="cards"><button class="card purple" onclick="goto('english')"><span class="emoji">📖</span><div><strong>Inglês</strong><small>Leitura e escrita</small></div></button><button class="card green" onclick="startMemory()"><span class="emoji">🧠</span><div><strong>Memória</strong><small>Encontre os pares</small></div></button><button class="card orange" onclick="startLogic()"><span class="emoji">🧩</span><div><strong>Lógica</strong><small>Resolva desafios</small></div></button><button class="card blue" onclick="startAttention()"><span class="emoji">⚡</span><div><strong>Atenção</strong><small>Observe a sequência</small></div></button></div><div class="stats"><div class="stat"><b>${data.completed.length}</b><small>Aulas</small></div><div class="stat"><b>${data.xp}</b><small>Pontos XP</small></div><div class="stat"><b>${Math.round(data.completed.length/12*100)}%</b><small>Inglês</small></div></div>`}else if(state.page==='english'){html=`${head('Inglês')}<h1>Inglês para ler o mundo.</h1><p>Comece por qualquer aula. Toque nas respostas e receba explicações imediatas.</p><div class="list">${lessons.map((l,i)=>`<button class="lesson" onclick="openLesson(${i})"><div class="num">${data.completed.includes(i)?'✓':i+1}</div><div><strong>${escapeHtml(l.title)}</strong><small>${l.level} · 3 perguntas · leitura</small></div><span class="chev">›</span></button>`).join('')}</div>`}else if(state.page==='lesson'){let l=lessons[state.lesson],q=l.q[state.q];html=`<button class="back" onclick="goto('english')">← Todas as aulas</button><div class="eyebrow">Aula ${state.lesson+1} de 12 · ${l.level}</div><h1>${escapeHtml(l.title)}</h1><div class="progress"><div style="width:${state.q/3*100}%"></div></div><div class="panel"><div class="eyebrow">Leia com atenção</div><p class="story">${escapeHtml(l.story)}</p><div>${l.vocab.map(v=>`<button class="tag" onclick="alert('${v[0]} = ${v[1]}')">${v[0]} ⓘ</button>`).join('')}</div></div><div class="panel"><div class="eyebrow">Pergunta ${state.q+1} de 3</div><h2>${escapeHtml(q[0])}</h2>${q[1].map((o,i)=>`<button class="option ${state.selected===i?(state.show&&i!==q[2]?'wrong':'selected'):''}" onclick="answer(${i})" ${state.show?'disabled':''}>${String.fromCharCode(65+i)}. ${escapeHtml(o)}</button>`).join('')}${state.show?`<div class="feedback">${state.selected===q[2]?'✓ Muito bem!':'Resposta correta: '+q[1][q[2]]}<br><small>${q[3]}</small></div><button class="primary wide" onclick="nextQuestion()">${state.q===2?'Concluir aula':'Próxima pergunta'} →</button>`:''}</div>`}else if(state.page==='brain'){html=`${head('Treino mental')}<h1>Desafie sua mente.</h1><p>Atividades curtas de atenção, memória e lógica. Elas ajudam a praticar habilidades específicas, mas não são tratamento médico.</p><div class="cards"><button class="card green" onclick="startMemory()"><span class="emoji">🧠</span><div><strong>Jogo da memória</strong><small>Encontre 6 pares</small></div></button><button class="card orange" onclick="startLogic()"><span class="emoji">🧩</span><div><strong>Raciocínio lógico</strong><small>6 desafios</small></div></button><button class="card blue" onclick="startAttention()"><span class="emoji">⚡</span><div><strong>Sequência visual</strong><small>Observe e repita</small></div></button><button class="card purple" onclick="goto('english')"><span class="emoji">📚</span><div><strong>Aprenda algo novo</strong><small>Inglês em contexto</small></div></button></div>`}else if(state.page==='memory'){let done=state.matched.length===12;html=`<button class="back" onclick="goto('brain')">← Treino mental</button><div class="eyebrow">Memória visual</div><h1>Encontre os pares</h1><p>Toque nas cartas e encontre os símbolos iguais.</p><div class="stats" style="margin-bottom:18px"><div class="stat"><b>${state.matched.length/2}/6</b><small>Pares</small></div><div class="stat"><b>${state.moves}</b><small>Tentativas</small></div><div class="stat"><b>${data.best||'—'}</b><small>Melhor marca</small></div></div><div class="memory-grid">${state.grid.map((v,i)=>`<button class="tile ${state.open.includes(i)?'open':''} ${state.matched.includes(i)?'matched':''}" onclick="flip(${i})">${state.open.includes(i)||state.matched.includes(i)?v:'?'}</button>`).join('')}</div>${done?`<div class="feedback">Parabéns! Você encontrou todos os pares em ${state.moves} tentativas.</div>`:''}<button class="secondary wide" style="margin-top:18px" onclick="startMemory()">Novo jogo ↻</button>`}else if(state.page==='logic'){let q=puzzles[state.step];html=`<button class="back" onclick="goto('brain')">← Treino mental</button><div class="eyebrow">Lógica · ${Math.min(state.step+1,6)} de 6</div><h1>Desafios de raciocínio</h1>${q?`<div class="panel"><h2>${q.q}</h2>${q.opts.map((o,i)=>`<button class="option ${state.selected===i?'selected':''}" onclick="logicAnswer(${i})" ${state.show?'disabled':''}>${escapeHtml(o)}</button>`).join('')}${state.show?`<div class="feedback">${state.selected===q.a?'✓ Acertou!':'Resposta: '+q.opts[q.a]}<br>${q.why}</div><button class="primary wide" onclick="state.step++;state.show=false;state.selected=null;render()">${state.step===5?'Ver resultado':'Próximo desafio'} →</button>`:''}</div>`:`<div class="panel center"><div class="big-num">Concluído!</div><p>Você terminou os seis desafios.</p><button class="primary" onclick="startLogic()">Recomeçar</button></div>`}` }else if(state.page==='attention'){html=`<button class="back" onclick="goto('brain')">← Treino mental</button><div class="eyebrow">Atenção visual</div><h1>Observe a sequência</h1><p>Memorize os símbolos apresentados por 5 segundos. Depois, escolha a ordem correta.</p><div class="panel center">${state.shown?`<div class="big-num" style="font-size:30px">${state.seq.join('  ')}</div><p>Observe com atenção.</p><button class="primary" onclick="state.shown=false;render()">Já memorizei</button>`:`<p>Qual foi a sequência?</p>${state.choices.map((v,i)=>`<button class="option" onclick="attentionAnswer(${i})">${v.join('  ')}</button>`).join('')}</div><button class="secondary wide" onclick="startAttention()">Nova sequência ↻</button>`}`}else if(state.page==='progress'){html=`${head('Progresso')}<h1>Sua evolução.</h1><p>Pequenas sessões frequentes ajudam a consolidar o aprendizado.</p><div class="stats"><div class="stat"><b>${data.completed.length}</b><small>Aulas feitas</small></div><div class="stat"><b>${data.xp}</b><small>XP</small></div><div class="stat"><b>${data.best||'—'}</b><small>Memória</small></div></div><div class="panel"><h2>Inglês</h2><div class="progress"><div style="width:${data.completed.length/12*100}%"></div></div><p>${data.completed.length} de 12 aulas concluídas</p></div><div class="panel"><h2>Como aprender melhor</h2><p>Depois de ler, tente lembrar três ideias sem olhar o texto. Revise no dia seguinte. Se errar, volte ao trecho correspondente.</p></div><button class="secondary wide" onclick="if(confirm('Apagar todo o progresso salvo neste aparelho?')){data={completed:[],xp:0,best:0};save();render()}">Limpar progresso</button>`}$('#app').innerHTML=html}
function openLesson(i){state.lesson=i;state.q=0;state.page='lesson';state.show=false;state.selected=null;render();scrollTo(0,0)}function answer(i){if(state.show)return;state.selected=i;state.show=true;if(i===lessons[state.lesson].q[state.q][2]){data.xp+=10;save()}render()}function nextQuestion(){if(state.q<2){state.q++;state.selected=null;state.show=false;render()}else{if(!data.completed.includes(state.lesson)){data.completed.push(state.lesson);data.xp+=25;save()}goto('english')}}function startMemory(){let icons=['🌙','⭐','🌿','🔥','💎','🚀'];state.grid=[...icons,...icons].sort(()=>Math.random()-.5);state.open=[];state.matched=[];state.moves=0;state.page='memory';render()}function flip(i){if(state.open.includes(i)||state.matched.includes(i)||state.open.length>=2)return;state.open.push(i);if(state.open.length===2){state.moves++;let [a,b]=state.open;if(state.grid[a]===state.grid[b]){state.matched.push(a,b);state.open=[];if(state.matched.length===12){data.xp+=30;if(!data.best||state.moves<data.best)data.best=state.moves;save()}}else{render();setTimeout(()=>{state.open=[];render()},700);return}}render()}function startLogic(){state.step=0;state.show=false;state.selected=null;state.page='logic';render()}function logicAnswer(i){if(state.show)return;state.selected=i;state.show=true;if(i===puzzles[state.step].a){data.xp+=10;save()}render()}function startAttention(){let sym=['🔵','🟡','🟣','🟢','🔴'];state.seq=Array.from({length:4},()=>sym[Math.floor(Math.random()*sym.length)]);let wrong1=[...state.seq],wrong2=[...state.seq];wrong1[1]=sym.filter(x=>x!==wrong1[1])[Math.floor(Math.random()*4)];wrong2[3]=sym.filter(x=>x!==wrong2[3])[Math.floor(Math.random()*4)];state.choices=[state.seq,wrong1,wrong2].sort(()=>Math.random()-.5);state.shown=true;state.page='attention';render()}function attentionAnswer(i){let ok=state.choices[i].join()===state.seq.join();if(ok){data.xp+=15;save()}alert(ok?'Muito bem! +15 XP':'Ainda não! A sequência era: '+state.seq.join(' '));startAttention()}render();
</script></body></html>
